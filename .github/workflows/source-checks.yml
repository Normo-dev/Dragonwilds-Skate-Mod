name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source inventory and exclusions
        run: python -B tools/dev.py verify
      - name: Show component build plan
        run: python -B tools/dev.py plan
